# Метаданные пакета hexlet-code и зависимости.
# Ключевое: имя проекта hexlet-code (требование Хекслета),
# пакет для импорта — task_manager (from task_manager import settings).

[project]
name = "hexlet-code"
version = "0.1.0"
description = "Менеджер задач — учебный Django-проект Хекслета"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2,<6",
    "python-dotenv>=1.0",
    "dj-database-url>=2.0",
    "psycopg2-binary>=2.9",
    "gunicorn>=23.0",
    "whitenoise>=6.9",
    "django-tailwind-cli>=4.8.0",
    "django-filter>=24.3",
    "sentry-sdk>=2.68.1",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["task_manager"]

# Линтер не проверяет автогенерируемые миграции и settings.py
# (подсказка Хекслета: иначе ругается на код Django).
[tool.ruff]
exclude = [
    "**/migrations/**",
    "**/settings.py",
]

[tool.ruff.lint]
ignore = ["RUF012"]
