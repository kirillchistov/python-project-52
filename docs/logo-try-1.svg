<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Центральная мишень/ядро -->
  <circle cx="50" cy="50" r="12" fill="#FF6B35" />
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
  
  <!-- Орбиты с фокусом на центре -->
  <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="#FF6B35" stroke-width="3" stroke-dasharray="4 4" transform="rotate(30, 50, 50)" />
  <ellipse cx="50" cy="50" rx="35" ry="12" fill="none" stroke="#FFB800" stroke-width="3" stroke-dasharray="6 3" transform="rotate(-45, 50, 50)" />
  <ellipse cx="50" cy="50" rx="40" ry="10" fill="none" stroke="#FF6B35" stroke-width="2" transform="rotate(75, 50, 50)" />
  
  <!-- Спутники задач -->
  <circle cx="75" cy="28" r="4" fill="#FFB800" />
  <circle cx="25" cy="72" r="4" fill="#FF8C42" />
  <circle cx="80" cy="65" r="3" fill="#FF6B35" />
  
  <!-- Вектор фокуса (прицел) -->
  <line x1="50" y1="2" x2="50" y2="18" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="82" x2="50" y2="98" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
  <line x1="2" y1="50" x2="18" y2="50" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
  <line x1="82" y1="50" x2="98" y2="50" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" />
</svg>