<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Нейронная сеть (связи) -->
  <line x1="20" y1="30" x2="50" y2="50" stroke="#A29BFE" stroke-width="2" />
  <line x1="80" y1="30" x2="50" y2="50" stroke="#A29BFE" stroke-width="2" />
  <line x1="20" y1="70" x2="50" y2="50" stroke="#A29BFE" stroke-width="2" />
  <line x1="80" y1="70" x2="50" y2="50" stroke="#A29BFE" stroke-width="2" />
  <line x1="35" y1="20" x2="50" y2="50" stroke="#A29BFE" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="65" y1="80" x2="50" y2="50" stroke="#A29BFE" stroke-width="1.5" stroke-dasharray="3 3" />
  
  <!-- Узлы-участники (команда) -->
  <circle cx="20" cy="30" r="8" fill="#4A6CF7" />
  <circle cx="80" cy="30" r="8" fill="#4A6CF7" />
  <circle cx="20" cy="70" r="8" fill="#4A6CF7" />
  <circle cx="80" cy="70" r="8" fill="#4A6CF7" />
  <circle cx="35" cy="20" r="6" fill="#6C5CE7" />
  <circle cx="65" cy="80" r="6" fill="#6C5CE7" />
  
  <!-- Изображение людей в узлах (стилизовано) -->
  <circle cx="20" cy="26" r="3" fill="#FFFFFF" />
  <circle cx="80" cy="26" r="3" fill="#FFFFFF" />
  <circle cx="20" cy="66" r="3" fill="#FFFFFF" />
  <circle cx="80" cy="66" r="3" fill="#FFFFFF" />
  
  <!-- Центральный AI-координатор (Коллективный IQ) -->
  <circle cx="50" cy="50" r="14" fill="#FFD700" />
  <circle cx="50" cy="50" r="10" fill="#FFFFFF" />
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4A6CF7" text-anchor="middle">AI</text>
  
  <!-- Пульсация координатора -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5" />
</svg>