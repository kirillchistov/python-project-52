  <rect x="15" y="15" width="70" height="70" rx="16" fill="none" stroke="#4A6CF7" stroke-width="4" />
  
  <!-- Умная галочка-молния -->
  <polyline points="30,52 46,68 70,32" fill="none" stroke="#4A6CF7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Эффект скорости (следы) -->
