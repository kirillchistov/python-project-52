{% if messages %}
    {% for message in messages %}
        <div role="alert" class="mb-4 rounded-md border px-4 py-3
            {% if message.tags == 'success' %}border-green-300 bg-green-100 text-green-900
            {% elif message.tags == 'error' %}border-red-300 bg-red-100 text-red-900
            {% elif message.tags == 'warning' %}border-yellow-300 bg-yellow-100 text-yellow-900
            {% else %}border-blue-300 bg-blue-100 text-blue-900{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
