{% load i18n %}
{% if messages %}
    <div class="mx-auto w-full max-w-6xl px-4 pt-6">
        {% for message in messages %}
            <div role="alert" class="mb-3 rounded-xl border px-4 py-3 text-sm
                {% if message.tags == 'success' %}border-emerald-300 bg-emerald-50 text-emerald-950 dark:border-emerald-500/40 dark:bg-emerald-500/10 dark:text-emerald-100
                {% elif message.tags == 'error' %}border-coral/40 bg-coral/10 text-coral-dark dark:text-coral
                {% elif message.tags == 'warning' %}border-amber-300 bg-amber-50 text-amber-950 dark:border-amber-500/40 dark:bg-amber-500/10 dark:text-amber-100
                {% else %}border-sky-300 bg-sky-50 text-sky-950 dark:border-sky-500/40 dark:bg-sky-500/10 dark:text-sky-100{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}
