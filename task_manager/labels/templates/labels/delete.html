{% extends "base.html" %}
{% load i18n %}
{% comment %}Подтверждение удаления метки.{% endcomment %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ title }}</h1>
<p class="mb-4 text-ink-muted dark:text-sand/70">{% trans "Are you sure you want to delete" %} {{ object }}?</p>
<form method="post" class="surface max-w-xl p-6">
    {% csrf_token %}
    <button type="submit" class="btn-primary">
        {{ button_text }}
    </button>
</form>
{% endblock %}
