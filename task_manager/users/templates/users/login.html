{% extends "base.html" %}
{% load i18n %}
{% comment %}Вход: username + password, кнопка «Войти».{% endcomment %}

{% block title %}{% trans "Log in" %}{% endblock %}

{% block content %}
<h1 class="mb-4 text-3xl font-bold">{% trans "Log in" %}</h1>
<form method="post" class="max-w-xl">
    {% include "includes/form_fields.html" %}
    <button type="submit" class="rounded-md bg-blue-600 px-4 py-2 text-white hover:bg-blue-700">
        {% trans "Sign in" %}
    </button>
</form>
{% endblock %}
