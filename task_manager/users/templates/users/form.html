{% extends "base.html" %}
{% load i18n %}
{% comment %}Регистрация и правка пользователя — одна форма, разный title/кнопка.{% endcomment %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="page-title">{{ title }}</h1>
<form method="post" class="surface max-w-xl p-6">
    {% include "includes/form_fields.html" %}
    <button type="submit" class="btn-primary">
        {{ button_text }}
    </button>
</form>
{% endblock %}
